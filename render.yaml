# Render deploys the Laravel API from this file. Values marked `sync: false`
# are secrets: Render asks for them once, and they never go in this repo.
services:
  - type: web
    name: communityfix-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: CommunityFix
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: SESSION_DRIVER
        value: array
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: pgsql
      - key: FILESYSTEM_DISK
        value: s3
      - key: MAIL_MAILER
        value: smtp
      # Run `php artisan key:generate --show` and paste the result.
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: MAP_CENTER
        sync: false
      # PostgreSQL connection string from your database host.
      - key: DB_URL
        sync: false
      # S3-compatible photo storage.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_URL
        sync: false
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"
      # SMTP login from your email provider.
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
